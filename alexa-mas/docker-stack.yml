version: "3.6"

services:
    skill:
        image: ghcr.io/alams154/music-assistant-skill:latest
        environment:
            - SKILL_HOSTNAME=https://alexa.llgv.qzz.io #required
            - MA_HOSTNAME=https://alexa.home.llgv.qzz.io #optional, if only using APL devices
            - PORT=5000 #optional
            - DEBUG_PORT=5678 #optional
            - LOCALE=en-US # optional: skill locale (e.g. en-US, en-GB, de-DE)
            # - AWS_DEFAULT_REGION=us-east-1 #optional
            - TZ=America/Sao_Paulo # set container timezone (override as needed)
        volumes:
            - data:/root/.ask
        networks:
            - traefik
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]
            labels:
                traefik.http.routers.alex.rule: Host(`alex.home.llgv.qzz.io`)
                traefik.http.services.alex.loadbalancer.server.port: 5000
volumes:
    data:
networks:
    traefik:
        external: true
