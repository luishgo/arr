version: '3.6'

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - bazarr-config:/config
      - /mnt/pve/dados:/dados
    networks:
      - traefik
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.http.routers.bazarr.rule: Host(`bazarr.home.llgv.qzz.io`)
        traefik.http.services.bazarr.loadbalancer.server.port: 6767
