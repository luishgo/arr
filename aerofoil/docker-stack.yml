version: "3"

services:
    app:
        image: luketanti/aerofoil:latest
        environment:
            #   # For write permission in config directory
            #   - PUID=1000
            #   - PGID=1000
            #   # to create/update an admin user at startup
            - USER_ADMIN_NAME=admin
            - USER_ADMIN_PASSWORD=admin1
        #   # to create/update a regular user at startup
        #   - USER_GUEST_NAME=guest
        #   - USER_GUEST_PASSWORD=oerze!@8981
        #   # cache TTLs (seconds): use none/unset for rebuild-only
        #   - SHOP_SECTIONS_CACHE_TTL_S=none
        #   - MEDIA_INDEX_TTL_S=none
        volumes:
            - games:/games
            - /mnt/pve/stardust/games:/stardust-games
            - config:/app/config
            - data:/app/data
        networks:
            - traefik
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]
            labels:
                traefik.http.routers.aerofoil.rule: Host(`aerofoil.home.llgv.qzz.io`)
                traefik.http.services.aerofoil.loadbalancer.server.port: 8465

volumes:
    games:
    config:
    data:
networks:
    traefik:
        external: true
