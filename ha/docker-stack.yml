version: "3.6"

services:
    app:
        image: "ghcr.io/home-assistant/home-assistant:stable"
        privileged: true
        network_mode: host
        volumes:
            - config:/config
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
        networks:
            # - traefik
            - outside
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]
            # labels:
            #   traefik.http.routers.ha.rule: Host(`ha.home.llgv.qzz.io`)
            #   traefik.http.services.ha.loadbalancer.server.port: 8123
    music-assistant-server:
        image: ghcr.io/music-assistant/server:latest
        privileged: true
        network_mode: host
        networks:
            # - traefik
            - outside
        volumes:
            - data:/data/
        # privileged caps (and security-opt) needed to mount smb folders within the container
        cap_add:
            - SYS_ADMIN
            - DAC_READ_SEARCH
        security_opt:
            - apparmor:unconfined
        environment:
            # Provide logging level as environment variable.
            # default=info, possible=(critical, error, warning, info, debug)
            - LOG_LEVEL=info
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]
            labels:
                traefik.http.routers.mas.rule: Host(`mas.home.llgv.qzz.io`)
                traefik.http.services.mas.loadbalancer.server.port: 8095
volumes:
    config:
    data:
networks:
    # traefik:
    # external: true
    outside:
        external: true
        name: "host"
