version: '3.6'

services:
  app:
    image: lscr.io/linuxserver/heimdall:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - config:/config
    networks:
      - traefik
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.http.routers.heimdall.rule: Host(`heimdall.home.llgv.qzz.io`)
        traefik.http.services.heimdall.loadbalancer.server.port: 80
volumes:
  config:
networks:
  traefik:
    external: true