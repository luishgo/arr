version: '3.6'

services:
  app:
    image: stremio/server:latest
    environment:
      - TZ=America/Sao_Paulo
      - NO_CORS=1
    # networks:
      # - traefik
    ports:
      - 11470:11470
      - 12470:12470
    volumes:
      - config:/root/.stremio-server
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      # labels:
        # traefik.http.routers.stremio.rule: Host(`stremio.local`)
        # traefik.http.services.stremio.loadbalancer.server.port: 11470
# networks:
  # traefik:
    # external: true
volumes:
  config: